# BEGIN_KITTY_THEME
background #022B00
foreground #0BFF00
cursor #0BFF00

selection_background  #0a8a2a
color0                #021400
color8                #016d27
color1                #e23829
color9                #ff5e4d
color2                #0BFF00
color10               #9fff6d
color3                #649a25
color11               #d1ff6d
color4                #149b45
color12               #72ffb5
color5                #53b82b
color13               #50ff3d
color6                #2bb767
color14               #22ff71
color7                #dffeee
color15               #daeed0
selection_foreground  #021400

cursor_shape block
cursor_text_color background
shell_integration no-cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
# END_KITTY_THEME
#
tab_bar_style powerline
tab_bar_edge bottom
active_tab_foreground   #021400
active_tab_background    #0BFF00
inactive_tab_foreground #0a8a2a
inactive_tab_background  #021400
tab_bar_background       #011300
tab_title_template      "{bell_symbol}{activity_symbol}{index}:{title}"
active_tab_font_style   bold
bell_on_tab             "● "
tab_activity_symbol     "▸ "

background_opacity 0.85
# background_image ./tapety-apple-1.jpg
background_image_layout scaled
background_blur 50
dynamic_background_opacity yes

# font_family MesloLGS NF
font_family      family="ShureTechMono Nerd Font Mono Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18

enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #0a8a2a
bell_border_color #d1ff6d
window_alert_on_bell yes

url_color #22ff71
url_style curly

# Para moverme en el tmux
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down 

#copy/paste de varios buffers
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

shell zsh

# Fallout 3 — bordes de splits y resaltados de busqueda
active_border_color     #0BFF00
inactive_border_color   #075c1c

mark1_foreground #021400
mark1_background #0BFF00
mark2_foreground #021400
mark2_background #9fff6d
mark3_foreground #021400
mark3_background #2bb767

# ════════════════════════════════════════════════════════════
#  Funcionalidad (manteniendo el estilo Fallout / CRT verde)
# ════════════════════════════════════════════════════════════

# --- Scrollback: mucho mas historial + buffer para el pager ---
scrollback_lines               50000
scrollback_pager_history_size  64

# --- Layouts y splits (el primero es el default) ---
enabled_layouts splits,stack,tall,fat,grid
# split vertical (lado a lado) y horizontal (apilado), heredando el cwd
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
# (ctrl+flechas ya mueven el foco; ctrl+shift+l rota el layout; ctrl+shift+z = stack)

# --- Ventanas / foco ---
# window_padding_width: "bezel" de monitor alrededor del texto
window_padding_width      8
# inactive_text_alpha: atenua splits no enfocados -> resalta el activo
inactive_text_alpha       0.75
# dim_opacity: legibilidad del texto ANSI "dim"
dim_opacity               0.70
# confirm_os_window_close: -1 = solo pregunta si hay un programa corriendo
confirm_os_window_close   -1

# --- Marks: resalta palabras clave usando los colores mark1/2/3 ---
map ctrl+shift+m>t toggle_marker iregex 1 \b(TODO|FIXME|XXX|HACK)\b
map ctrl+shift+m>e toggle_marker iregex 2 \b(ERROR|FATAL|FAIL|PANIC)\b
map ctrl+shift+m>w toggle_marker iregex 3 \b(WARN|WARNING|DEPRECATED)\b
map ctrl+shift+m>m create_marker
map ctrl+shift+m>c remove_marker

# --- Portapapeles / seleccion ---
# copy_on_select: seleccionar ya copia al portapapeles
copy_on_select               clipboard
# strip_trailing_spaces: limpia espacios al final al copiar
strip_trailing_spaces        smart
# select_by_word_characters: doble-click agarra rutas/host:port enteros
select_by_word_characters    @-./_~?&=%+#:
# clear_terminal estilo Terminal.app (cmd+k)
map cmd+k clear_terminal to_cursor active

# --- macOS ---
# macos_option_as_alt: Option = Alt (atajos de shell/vim); rompe acentos por Option
macos_option_as_alt          yes
# macos_titlebar_color: titlebar en verde-negro, integrado al tema
macos_titlebar_color         background
# macos_thicken_font: engrosa el glifo en retina -> mas "glow" de fosforo
macos_thicken_font           0.30
# update_check_interval: 0 = sin avisos de actualizacion
update_check_interval        0